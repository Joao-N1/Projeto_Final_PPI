<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style_login.css">

    <title>Sign-In</title>
</head>
<body>

    <div class="auth-container">
            <h2>Criar Conta</h2>
            <form id="cadastroForm">
                <div class="form-group">
                    <label for="nome">Nome de Usuário</label>
                    <input type="text" id="nome" placeholder="Seu usuário" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha secreta" required>
                </div>

                <button type="submit">Cadastrar</button>
            </form>

            <div class="footer-link">
                Já tem uma conta? <a href="login_page.html">Faça Login</a>
            </div>
        </div>

    

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Impede a página de recarregar
            
            const nome = document.getElementById('nome').value;
            const senha = document.getElementById('senha').value;

            try {
                // Envia os dados para a rota de cadastro do backend Python
                const response = await fetch('http://localhost:8000/signin/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, senha })
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert('Usuário cadastrado com sucesso!');
                    window.location.href = 'login_page.html'; // Redireciona para o login
                } else {
                    alert('Erro: ' + data.detail);
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Não foi possível conectar ao servidor.');
            }
        });
    </script>
</body>
</html>
