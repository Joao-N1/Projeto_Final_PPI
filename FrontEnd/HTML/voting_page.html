<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Votação</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">


    <script>
        // Segurança: Se não houver utilizador no localStorage, bloqueia o acesso
        if (!localStorage.getItem('usuarioLogado')) {
            alert('Por favor, faça login para conseguir votar.');
            window.location.href = 'login_page.html';
        }
        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login_page.html';
        }
    </script>
</head>
<body>

    <nav class="navbar">
        <a href="home_page.html" class="nav-brand">OSCAR VOTE</a>
        <div class="nav-links">
            <a href="home_page.html" class="active">Votação</a>
            <a href="results_page.html">Resultados</a>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </nav>

    <main class="main-container">
        <h2 class="page-title">Boletim de Voto</h2>
        <p class="user-info">Utilizador Ativo: <strong id="nomeUsuario" style="color: var(--gold);"></strong></p>
        
        <div id="contentorCategorias">
            <p style="text-align: center; color: var(--text-secondary);">Carregando Categorias</p>
        </div>
    </main>


    <script>
        // Mostra o utilizador logado no topo
        const usuarioAtivo = localStorage.getItem('usuarioLogado');
        document.getElementById('nomeUsuario').textContent = usuarioAtivo;

        // Função que procura as categorias no Python e desenha no ecrã
        async function carregarCategorias() {
            try {
                const response = await fetch('http://localhost:8000/categorias/');
                if (!response.ok) throw new Error('Erro ao buscar categorias');
                
                const categorias = await response.json();
                const container = document.getElementById('contentorCategorias');
                container.innerHTML = '';

                if (categorias.length === 0) {
                    container.innerHTML = '<p>Nenhuma categoria disponível para votação de momento.</p>';
                    return;
                }

                categorias.forEach(cat => {
                    // Cria uma secção (bloco) para cada categoria
                    const section = document.createElement('div');
                    section.className = 'category_card'

                    section.innerHTML = `
                        <h3>${cat.nome} <span style="font-size: 0.9rem; color: var(--text-secondary); float: right;">${cat.tipo}</span></h3>
                        <form onsubmit="submeterVoto(event, ${cat.id})">
                            <label class="option-container">
                                <input type="radio" name="categoria_${cat.id}" value="1" required> 
                                <div class="option-content">
                                    <img src="${cat.cand1_img}" alt="${cat.cand1_nome}" class="movie-poster">
                                    <span>${cat.cand1_nome}</span>
                                </div>
                            </label>

                            <label class="option-container">
                                <input type="radio" name="categoria_${cat.id}" value="2"> 
                                <div class="option-content">
                                    <img src="${cat.cand2_img}" alt="${cat.cand2_nome}" class="movie-poster">
                                    <span>${cat.cand2_nome}</span>
                                </div>
                            </label>

                            <label class="option-container">
                                <input type="radio" name="categoria_${cat.id}" value="3"> 
                                <div class="option-content">
                                    <img src="${cat.cand3_img}" alt="${cat.cand3_nome}" class="movie-poster">
                                    <span>${cat.cand3_nome}</span>
                                </div>
                            </label>

                            <label class="option-container">
                                <input type="radio" name="categoria_${cat.id}" value="4"> 
                                <div class="option-content">
                                    <img src="${cat.cand4_img}" alt="${cat.cand4_nome}" class="movie-poster">
                                    <span>${cat.cand4_nome}</span>
                                </div>
                            </label>

                            <button type="submit" class="btn-vote">Confirmar Voto</button>
                            <br><br><br>
                        </form>
                    `;
                    container.appendChild(section);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('contentorCategorias').textContent = 'Erro ao ligar ao servidor.';
            }
        }

        
        async function submeterVoto(event, categoriaId) {
            event.preventDefault(); // Impede o recarregamento do formulário

            const formulario = event.target;
            const opcaoSelecionada = formulario.querySelector(`input[name="categoria_${categoriaId}"]:checked`).value;

            const dadosVoto = {
                user_nome: usuarioAtivo, // Retirado do localStorage
                categoria_id: categoriaId,
                voto: parseInt(opcaoSelecionada) // Converte "1" para o número 1
            };

            console.log(dadosVoto)

            try {
                const response = await fetch('http://localhost:8000/votos/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosVoto)
                });

                const respostaServidor = await response.json();

                if (response.ok) {
                    alert('Sucesso: ' + (respostaServidor.message || "Voto registado!"));
                    formulario.querySelector('button').disabled = true;
                } else{
                    if (respostaServidor.detail && typeof respostaServidor.detail === 'string') {
                        alert('Erro do Servidor: ' + respostaServidor.detail);
                    }
                    else if (respostaServidor.detail && typeof respostaServidor.detail === 'object') {
                        alert('Erro de Validação: ' + JSON.stringify(respostaServidor.detail));
                    }
                    else{
                        alert('Erro Desconhecido: ' + JSON.stringify(respostaServidor));
                    }
                }
            } catch (error) {
                console.error('Erro no envio do voto:', error);
                alert('Erro de comunicação com o servidor.');
            }
        }

        // Executa a função assim que a página abre
        carregarCategorias();
    </script>
</body>
</html>
