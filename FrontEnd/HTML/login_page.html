<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Acessar Conta</h2>
    <form id="loginForm">
        <label for="nome">Nome de Usuário:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const senha = document.getElementById('senha').value;

            try {
                // Envia os dados para a rota de login do backend Python
                const response = await fetch('http://localhost:8000/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Login bem-sucedido! Bem-vindo, ' + nome);

                    // GUARDA O USUÁRIO NO NAVEGADOR
                    localStorage.setItem('usuarioLogado', nome);

                    // REDIRECIONA PARA A PÁGINA INICIAL
                    window.location.href = 'home_page.html';
                } else {
                    alert('Erro: ' + data.detail);
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Não foi possível conectar ao servidor.');
            }
        });
    </script>
</body>
</html>
