<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oscar Vote - Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../CSS/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        if (!localStorage.getItem('usuarioLogado')) {
            alert('Por favor, faça login para conseguir votar.');
            window.location.href = 'login_page.html';
        }
        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login_page.html';
        }
    </script>
    
</head>
<body>

    <nav class="navbar">
        <a href="home_page.html" class="nav-brand">OSCAR VOTE</a>
        <div class="nav-links">
            <a href="voting_page.html">Votação</a>
            <a href="results_page.html" class="active">Resultados</a>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </nav>

    <main class="main-container">
        <h2 class="page-title">Resultados Parciais</h2>
        <p class="user-info">Apuração em tempo real</p>
        
        <div id="contentorResultados">
            <p style="text-align: center; color: var(--text-secondary);">Contabilizando os envelopes...</p>
        </div>
    </main>


    <!-- 
    <h2>📊 Resultados Parciais da Votação</h2>
    <hr>

    <div id="contentorResultados">A carregar gráficos e resultados...</div>


    -->
    <script>
        // Configuração global do Chart.js para combinar com o tema escuro
        Chart.defaults.color = '#a0a0a0';
        Chart.defaults.font.family = 'Montserrat';

        async function carregarResultados() {
            try {
                const response = await fetch('http://localhost:8000/votos/resultados/');
                const dadosResultados = await response.json();
                const container = document.getElementById('contentorResultados');
                container.innerHTML = '';

                if (dadosResultados.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">Ainda não existem votos registados.</p>';
                    return;
                }
                const coresFatias = ['#d4af37', '#c0c0c0', '#cd7f32', '#e5e4e2'];

                dadosResultados.forEach((resultado, index) => {
                    const card = document.createElement('div');
                    card.className = 'category-card';
                    const canvasId = `chart_${index}`;
                    
                    card.innerHTML = `
                        <h3>${resultado.categoria_nome}</h3>
                        <div class="canvas-wrapper">
                            <canvas id="${canvasId}"></canvas>
                        </div>
                    `;
                    container.appendChild(card);

                    const ctx = document.getElementById(canvasId).getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut', // Doughnut é mais moderno que pizza simples
                        data: {
                            labels: resultado.candidatos,
                            datasets: [{
                                data: resultado.votos,
                                backgroundColor: coresFatias,
                                borderColor: '#141414',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'bottom' }
                            }
                        }
                    });
                });
            } catch (error) {
                document.getElementById('contentorResultados').textContent = 'Erro ao carregar dados.';
            }
        }

        carregarResultados();
    </script>
</body>
</html>
